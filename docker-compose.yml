version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=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
      - GROQ_MODEL=qwen/qwen3.8-27b
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

name: SatQuery AI V2 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Audit Backend Import Modules
        run: |
          cd backend
          python -c "import glob, sys, importlib; sys.path.insert(0, 'app'); [importlib.import_module(f.replace('/', '.').replace('\\\\', '.').replace('.py', '')) for f in glob.glob('app/**/*.py', recursive=True)]"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build
